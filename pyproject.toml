[project]
name = "pressure-chicken"
version = "0.1.0"
description = "압력밥솥 타이머 — 비전 기반 주방 모니터링 시스템"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.8.0; sys_platform == 'darwin'",
    "opencv-python>=4.8.0; sys_platform != 'darwin'",
    "pygame>=2.5.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "comtypes>=1.4.16",
]

# Windows/Linux: CUDA 12.8 (RTX 50xx Blackwell sm_120 지원)
# Mac: 기본 PyTorch(MPS)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
